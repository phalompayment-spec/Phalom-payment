<title>Phalom Prototype</title>
<style>
/*__FONTS__*/
/* Layout: phone frame beside a presenter demo panel; on phones the app fills the screen and the panel becomes a sheet */
:root{
  --st-bg:#e6dece; --st-ink:#3b2a20; --st-muted:#6b5646; --st-panel:#f6f0e4; --st-line:#d6cab4;
  --st-accent:#2f6a55; --st-on-accent:#f6f0e4; --st-clay:#b5653c; --st-bezel:#2a1e17; --st-chip:#ebe2d1;
  --f-head:'Noto Serif Lao','Noto Sans Lao','Phalom Sym',Georgia,serif;
  --f-body:'Noto Sans Lao','Phalom Sym',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Fraunces','Phalom Sym','Noto Sans Lao',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --st-bg:#0f1512; --st-ink:#efe7d8; --st-muted:#a3ada1; --st-panel:#19231e; --st-line:#2e3b34;
    --st-accent:#7cc0a2; --st-on-accent:#10201a; --st-clay:#e09a6e; --st-bezel:#050806; --st-chip:#222e28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --st-bg:#0f1512; --st-ink:#efe7d8; --st-muted:#a3ada1; --st-panel:#19231e; --st-line:#2e3b34;
  --st-accent:#7cc0a2; --st-on-accent:#10201a; --st-clay:#e09a6e; --st-bezel:#050806; --st-chip:#222e28; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--st-bg);color:var(--st-ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--st-clay);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{--lg-ink:var(--st-accent);--lg-acc:var(--st-clay);min-height:100%;box-sizing:border-box;padding-block:20px 28px;padding-inline:16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.stage-head{width:100%;max-width:770px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-family:var(--f-num);font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1}
.brand-sub{color:var(--st-muted);font-size:14px}
.sim-chip{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--st-clay);color:var(--st-clay)}
.stage-main{display:flex;gap:36px;align-items:flex-start;justify-content:center;width:100%}
.device{width:390px;height:820px;flex:none;border:10px solid var(--st-bezel);border-radius:52px;overflow:hidden;background:var(--st-bezel);box-shadow:0 30px 60px -32px rgba(40,25,10,.5)}

/* ---------- demo panel ---------- */
.panel{width:340px;flex:none;box-sizing:border-box;background:var(--st-panel);border:1px solid var(--st-line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px;max-height:840px;overflow:auto}
.panel h2{font-family:var(--f-head);font-size:19px;margin:0;line-height:1.3}
.pnote{margin:2px 0 0;font-size:13px;color:var(--st-muted)}
.pgroup{display:flex;flex-direction:column;gap:8px}
.plabel{font-size:12px;font-weight:600;color:var(--st-muted);letter-spacing:.02em}
.pbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pbtns.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pbtn{min-height:42px;border-radius:12px;border:1px solid var(--st-line);background:var(--st-chip);color:var(--st-ink);font-size:13px;line-height:1.3;cursor:pointer;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.pbtn:hover{border-color:var(--st-accent)}
.pbtn[aria-pressed="true"]{background:var(--st-accent);color:var(--st-on-accent);border-color:transparent;font-weight:700}
.pbtn.wide{width:100%}
.pbtn .pd{width:9px;height:9px;border-radius:50%;flex:none}
.pd.ok{background:#3f8f6f}.pd.wait{background:#c08a1e}.pd.bad{background:#b8513a}
.ptarget{font-size:12px;color:var(--st-muted)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:baseline;font-size:13px;padding:6px 8px;border-radius:10px;color:var(--st-muted)}
.steps li::before{content:counter(s);font-family:var(--f-num);font-weight:600;width:16px;flex:none;text-align:right}
.steps li.done{color:var(--st-ink)}
.steps li.done::before{content:"✓";color:var(--st-accent)}
.steps li.now{background:var(--st-chip);color:var(--st-ink);font-weight:600}
.scrim{display:none}

/* ---------- app tokens: light is the default; dark comes only from the in-app setting ---------- */
.app{
  --a-bg:#f6f0e4; --a-surface:#ebe2d1; --a-card:#fbf7ee; --a-ink:#3b2a20; --a-muted:#6b5646; --a-faint:#8f7f6f; --a-line:#ddd2bf;
  --a-primary:#2f6a55; --a-on-primary:#f6f0e4; --a-clay:#b5653c;
  --a-ok:#2f6a55; --a-ok-bg:#dceadf; --a-wait:#835509; --a-wait-dot:#c08a1e; --a-wait-bg:#f3e4c3;
  --a-bad:#a3402a; --a-bad-bg:#f2dbd2; --a-off:#56606a; --a-off-bg:#e2e0da;
  --a-band-ok:#2f6a55; --a-band-wait:#8a5d12; --a-band-bad:#a3402a; --a-band-off:#56606a; --a-band-ink:#f8f3ea;
  --a-sim-bg:#3b2a20; --a-sim-ink:#f6f0e4; --a-toast-bg:#3b2a20; --a-toast-ink:#f6f0e4;
  --lg-ink:var(--a-primary); --lg-acc:var(--a-clay);
  height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--a-bg);color:var(--a-ink);font-family:var(--f-body);color-scheme:light
}
.app[data-mode="dark"]{
  --a-bg:#16201b; --a-surface:#212d27; --a-card:#1b2621; --a-ink:#f1e9da; --a-muted:#a9b2a6; --a-faint:#7f8a82; --a-line:#2e3b34;
  --a-primary:#7cc0a2; --a-on-primary:#10201a; --a-clay:#e09a6e;
  --a-ok:#7cc0a2; --a-ok-bg:#1e3a2f; --a-wait:#e8bd66; --a-wait-dot:#e3b45a; --a-wait-bg:#3a321d;
  --a-bad:#ef9580; --a-bad-bg:#3d2620; --a-off:#c0c7cd; --a-off-bg:#2a312e;
  --a-band-ok:#2a5544; --a-band-wait:#6b5420; --a-band-bad:#7a3324; --a-band-off:#3c4550; --a-band-ink:#f1e9da;
  --a-sim-bg:#000000; --a-sim-ink:#e8bd66; --a-toast-bg:#f1e9da; --a-toast-ink:#16201b;
  color-scheme:dark
}
.app button:focus-visible{outline-color:var(--a-clay)}
.simbar{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;background:var(--a-sim-bg);color:var(--a-sim-ink);flex:none}
.simbar .sp{flex:1}
.simbar .netoff{padding:1px 8px;border-radius:999px;background:var(--a-band-off);color:var(--a-band-ink)}
.demo-btn{display:none;border:1px solid currentColor;background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.scr{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:14px 18px 18px;gap:12px}
.scr.flush{padding:0;gap:0}
.scr h1{font-family:var(--f-head);font-size:22px;font-weight:700;margin:0;line-height:1.3}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.grow b{font-weight:600;font-size:15px}
.grow small,.muted{color:var(--a-muted);font-size:12.5px}
.fine{margin:0;font-size:12px;color:var(--a-muted);display:flex;gap:6px;align-items:center;line-height:1.45}
.fine.center{justify-content:center;text-align:center}
.fine svg{flex:none}
.tag{font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--a-line);color:var(--a-muted);white-space:nowrap}

/* header */
.hdr{display:flex;align-items:center;gap:10px}
.shop{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.shop b{font-family:var(--f-head);font-size:17px;font-weight:700}
.shop small{font-size:12px;color:var(--a-muted)}
.topbar{display:flex;align-items:center;gap:6px;min-height:36px}
.topbar h1{flex:1;font-size:18px;text-align:center}
.topbar .spacer{width:40px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--a-ink)}
.iconbtn:hover{background:var(--a-surface)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--a-ok-bg);color:var(--a-ok)}
.pill.wait{background:var(--a-wait-bg);color:var(--a-wait)}
.pill.bad{background:var(--a-bad-bg);color:var(--a-bad)}
.pill.off{background:var(--a-off-bg);color:var(--a-off)}
.pill.line{background:transparent;border:1px solid var(--a-primary);color:var(--a-primary);font-weight:500}
.pill.inv{background:var(--a-band-ink);color:var(--a-ink)}
.app[data-mode="dark"] .pill.inv{color:var(--a-bg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--a-ok)}.dot.wait{background:var(--a-wait-dot)}.dot.bad{background:var(--a-bad)}.dot.off{background:var(--a-off)}

/* sell */
.routechip{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:var(--a-surface);border:0;text-align:left;cursor:pointer;width:100%;color:var(--a-ink)}
.routechip .chev{color:var(--a-faint)}
.rbadge{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:800;font-size:12px;letter-spacing:.04em;background:var(--a-bg);color:var(--a-primary);border:1.5px solid currentColor}
.rbadge.wait{color:var(--a-wait)}.rbadge.off{color:var(--a-off)}
.amtbox{display:flex;flex-direction:column;gap:2px;padding:4px 2px 0}
.lbl-row{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:13px;color:var(--a-muted)}
.link{border:0;background:none;color:var(--a-primary);font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px}
.amt{font-family:var(--f-num);font-weight:800;font-size:52px;line-height:1.08;letter-spacing:-1px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.amt .cur{font-size:24px;color:var(--a-clay);letter-spacing:0}
.amt.mid{font-size:38px}
.amt.mid .cur{font-size:19px}
.words{font-size:14px;color:var(--a-ink);min-height:21px}
.words.empty{color:var(--a-faint)}
.warn{font-size:13px;font-weight:600;color:var(--a-bad)}
.netline{font-size:13px;color:var(--a-primary);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.wave{display:block;width:100%;height:14px;color:var(--a-primary);flex:none}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.key{height:52px;border:0;border-radius:26px;background:var(--a-surface);color:var(--a-ink);font-family:var(--f-num);font-size:23px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--a-line);transform:scale(.97)}
.btn{min-height:54px;border:0;border-radius:27px;background:var(--a-primary);color:var(--a-on-primary);font-family:var(--f-head);font-size:17px;font-weight:700;cursor:pointer;width:100%;flex:none;padding:0 16px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--a-primary);border:1.5px solid var(--a-primary)}
.btnrow{display:flex;flex-direction:column;gap:8px}

/* check */
.sub{margin:-4px 0 0;font-size:14px;color:var(--a-muted)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:20px;background:var(--a-surface);border:2px solid transparent;width:100%;text-align:left;cursor:pointer;color:var(--a-ink)}
.row.sel{border-color:var(--a-primary)}
.row .time{font-size:13px;color:var(--a-muted);width:40px;flex:none}
.row .amtcell{font-weight:600;font-size:15px}
.row .strike{text-decoration:line-through;color:var(--a-faint)}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px}
.verdict.ok{background:var(--a-ok-bg);color:var(--a-ok)}
.verdict.wait{background:var(--a-wait-bg);color:var(--a-wait)}
.verdict.off{background:var(--a-off-bg);color:var(--a-off)}
.verdict b{font-family:var(--f-head);font-size:18px;display:block;line-height:1.3}
.verdict p{margin:2px 0 0;font-size:14px;color:var(--a-ink)}
.verdict .phrase{font-size:15px;font-weight:600;color:var(--a-ink);margin-top:6px}

/* sign */
.sign{align-items:stretch;justify-content:flex-start}
.signcard{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 18px;border-radius:28px;background:var(--a-card);border:1.5px solid var(--a-line)}
.signcard h2{font-family:var(--f-num);font-weight:800;font-size:34px;line-height:1.1;margin:4px 0 0;letter-spacing:-.5px}
.signcard .lo{font-family:var(--f-head);font-size:19px;margin:0}
.signlist{list-style:none;margin:6px 0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.signlist li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:var(--a-surface);font-size:15px}
.signlist li .mk{flex:none;display:flex}
.signlist li .tx{flex:1;min-width:0}
.signlist li small{color:var(--a-muted)}
.signlist .ok{color:var(--a-ok)}.signlist .wait{color:var(--a-wait)}.signlist .off{color:var(--a-off)}
.signfoot{font-size:13px;color:var(--a-muted);margin:0}
.signshop{margin-top:auto;font-size:14px;line-height:1.5}

/* qr */
.qr-amt{display:flex;flex-direction:column;align-items:center}
.qr-amt small{color:var(--a-muted);font-size:13px}
.qrcard{align-self:center;padding:14px 14px 10px;border-radius:26px;background:#ffffff;border:1px solid var(--a-line);display:flex;flex-direction:column;align-items:center;gap:6px}
.qrsvg{width:224px;height:224px;display:block}
.qr-name{font-family:system-ui,sans-serif;font-size:11.5px;letter-spacing:.06em;color:#2a1e17}
.accepts{display:flex;flex-direction:column;align-items:center;gap:6px}
.accepts small{color:var(--a-muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--a-surface)}
.waitline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--a-wait)}
.waitline.off{color:var(--a-off)}
.pulse{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* result */
.band{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:30px 20px 8px;color:var(--a-band-ink)}
.band.ok,.bandwave.ok{--bc:var(--a-band-ok)}
.band.wait,.bandwave.wait{--bc:var(--a-band-wait)}
.band.bad,.bandwave.bad{--bc:var(--a-band-bad)}
.band.off,.bandwave.off{--bc:var(--a-band-off)}
.band{background:var(--bc)}
.bandwave{display:block;width:100%;height:20px;color:var(--bc);flex:none}
.bicon{width:78px;height:78px;border-radius:50%;background:var(--a-band-ink);color:var(--bc);display:flex;align-items:center;justify-content:center}
.band h2{font-family:var(--f-head);font-size:27px;margin:2px 0 0;line-height:1.3}
.band .amt{color:var(--a-band-ink)}
.band .amt .cur{color:var(--a-band-ink);opacity:.8}
.rbody{display:flex;flex-direction:column;gap:12px;padding:6px 18px 18px;flex:1}
.advice{margin:0;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.advice.wait{background:var(--a-wait-bg);color:var(--a-wait)}
.advice.bad{background:var(--a-bad-bg);color:var(--a-bad)}
.advice.off{background:var(--a-off-bg);color:var(--a-off)}
.code{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--a-ok-bg)}
.code .cnum{font-family:var(--f-num);font-weight:800;font-size:36px;line-height:1;color:var(--a-ok);letter-spacing:2px}
.code span{font-size:12.5px;color:var(--a-ink);line-height:1.45}
.code small{display:block;font-weight:700;color:var(--a-ok);font-size:12.5px}
.kvs{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--a-line);font-size:14px}
.kv span:first-child{color:var(--a-muted)}
.kv .num{font-weight:600}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* history */
.htop{display:flex;justify-content:space-between;align-items:baseline}
.htop span{font-size:13px;color:var(--a-muted)}
.sum{display:flex;flex-direction:column;gap:2px}
.sum small{font-size:13px;color:var(--a-muted)}
.sumrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--a-muted)}
.sumrow b{color:var(--a-ink);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:0;border-radius:999px;padding:6px 13px;font-size:13px;background:var(--a-surface);color:var(--a-ink);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--a-primary);color:var(--a-on-primary);font-weight:700}

/* settings */
.shopcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--a-surface)}
.shopcard .grow b{font-family:var(--f-head);font-size:16px}
.group{display:flex;flex-direction:column;gap:8px}
.glabel{font-size:12.5px;font-weight:600;color:var(--a-muted)}
.hint{font-size:12px;color:var(--a-muted)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--a-surface)}
.seg button{flex:1;min-height:38px;border:0;border-radius:999px;background:transparent;color:var(--a-muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--a-primary);color:var(--a-on-primary);font-weight:700}
.list{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--a-line);font-size:15px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--a-ink)}
button.srow{cursor:pointer}
.srow .lead{color:var(--a-primary);display:flex}
.srow .grow{font-size:15px}
.srow .chev{color:var(--a-faint)}
.switch{width:48px;height:28px;border-radius:999px;border:0;background:var(--a-line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--a-bg);transition:left .15s}
.switch[aria-checked="true"]{background:var(--a-primary)}
.switch[aria-checked="true"]::after{left:23px}
.card{padding:14px;border-radius:18px;background:var(--a-surface);display:flex;flex-direction:column;gap:6px}
.card b{font-family:var(--f-head);font-size:16px}
.card p{margin:0;font-size:14px;line-height:1.55}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600}
.flow span{padding:3px 10px;border-radius:999px;background:var(--a-bg)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--a-line);font-size:14px}
.checklist li svg{color:var(--a-ok);flex:none;margin-top:2px}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{padding:10px 14px;border-radius:16px;background:var(--a-surface)}
.faq summary{cursor:pointer;font-weight:600;font-size:14px}
.faq p{margin:6px 0 0;font-size:14px;color:var(--a-ink)}

/* market */
.mk-top{display:flex;align-items:center;gap:6px}
.mk-top small{font-size:12.5px;color:var(--a-clay);font-weight:600}
.mk-top h1{font-size:19px}
.bar{height:10px;border-radius:999px;background:var(--a-surface);overflow:hidden}
.bar span{display:block;height:100%;background:var(--a-primary);border-radius:999px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats2 div{padding:12px;border-radius:16px;background:var(--a-surface);display:flex;flex-direction:column}
.stats2 small{font-size:12.5px;color:var(--a-muted)}
.stats2 b{font-size:22px;font-weight:800}
.share{display:flex;flex-direction:column;gap:7px}
.share div{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px}
.share .bar{height:8px}
.share .pct{text-align:right;font-weight:600}
.helprow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--a-surface)}
.mini{border:1px solid var(--a-primary);background:transparent;color:var(--a-primary);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}

/* tab bar, toast, overlay */
.tabbar{display:flex;border-top:1px solid var(--a-line);background:var(--a-bg);flex:none}
.tab{flex:1;height:60px;border:0;background:none;color:var(--a-faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;cursor:pointer}
.tab[aria-current="page"]{color:var(--a-primary);font-weight:700}
.toast{position:absolute;left:14px;right:14px;bottom:74px;z-index:20;padding:12px 14px;border-radius:16px;background:var(--a-toast-bg);color:var(--a-toast-ink);font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -12px rgba(0,0,0,.45)}
.ovl{position:absolute;inset:0;z-index:30;background:rgba(22,16,11,.62);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:16px}
.fakeshot{align-self:center;width:210px;border-radius:20px;padding:16px;background:#ffffff;color:#1f2a37;text-align:center;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;transform:rotate(-3deg);box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.fakeshot .fk-ic{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center}
.fakeshot b{display:block;font-size:15px}
.fakeshot .fk-amt{font-size:22px;font-weight:800;margin-top:2px}
.fakeshot small{color:#6b7280;font-size:11px}
.fk-label{align-self:center;font-size:12px;color:#f6f0e4;margin-top:6px}
.ovl .card{background:var(--a-bg)}
.ovl .card .pill{align-self:flex-start}

/* phones: app fills the screen; demo panel becomes a sheet */
@media (max-width: 899px){
  .stage{padding-block:0;padding-inline:0;gap:0;height:100%}
  .stage-head{display:none}
  .stage-main{flex:1;min-height:0;height:100%}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .demo-btn{display:inline-block}
  .panel{display:none}
  .panel.open{display:flex;position:fixed;left:0;right:0;bottom:0;width:auto;max-height:82%;z-index:60;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .scrim.open{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45)}
  .panel .closepanel{display:inline-flex}
}
.closepanel{display:none;margin-left:auto;border:1px solid var(--st-line);background:var(--st-chip);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}.switch::after{transition:none}}

const LD = ['', 'ໜຶ່ງ', 'ສອງ', 'ສາມ', 'ສີ່', 'ຫ້າ', 'ຫົກ', 'ເຈັດ', 'ແປດ', 'ເກົ້າ'];
const LP = ['', 'ສິບ', 'ຮ້ອຍ', 'ພັນ', 'ໝື່ນ', 'ແສນ'];
function laoBelowMillion(n) {
  const s = String(n); let out = '';
  for (let i = 0; i < s.length; i++) {
    const d = +s[i], p = s.length - 1 - i;
    if (!d) continue;
    if (p === 1) out += d === 1 ? 'ສິບ' : d === 2 ? 'ຊາວ' : LD[d] + 'ສິບ';
    else if (p === 0) out += (d === 1 && s.length > 1) ? 'ເອັດ' : LD[d];
    else out += LD[d] + LP[p];
  }
  return out;
}
function laoWords(n) {
  if (!n) return 'ສູນ';

/* QR-like pattern (illustration only, not a scannable payment code) */
function qrPath(seed) {
  let h = 2166136261;
  for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  let x = (h >>> 0) || 1;
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  const N = 25, g = [], res = [];
  for (let r = 0; r < N; r++) { g.push(new Array(N).fill(0)); res.push(new Array(N).fill(false)); }
  const finder = (r0, c0) => {
    for (let r = -1; r < 8; r++) for (let c = -1; c < 8; c++) {
      const rr = r0 + r, cc = c0 + c;
      if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue;
      res[rr][cc] = true;
      if (r >= 0 && r <= 6 && c >= 0 && c <= 6) g[rr][cc] = (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) ? 1 : 0;
    }
  };
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (let i = 8; i < N - 8; i++) { g[6][i] = g[i][6] = i % 2 === 0 ? 1 : 0; res[6][i] = res[i][6] = true; }
  for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) { g[18 + r][18 + c] = (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0)) ? 1 : 0; res[18 + r][18 + c] = true; }
  for (let r = 9; r < 16; r++) for (let c = 9; c < 16; c++) { res[r][c] = true; g[r][c] = 0; }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!res[r][c]) g[r][c] = rnd() < 0.5 ? 1 : 0;
  let d = '';
  for (let r = 0; r < N; r++) { let c = 0; while (c < N) { if (g[r][c]) { const s = c; while (c < N && g[r][c]) c++; d += `M${s} ${r}h${c - s}v1h-${c - s}z`; } else c++; } }
  return d;
}

let AC = null;
function ac() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; }
}
function tone(f, t0, dur, type = 'sine', vol = 0.22) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const CHIMES = [
  { name: 'ກະດິ່ງ', play: () => { tone(1046, 0, 0.9); tone(1568, 0.13, 1.1); } },
  { name: 'ຄ້ອງ',   play: () => { tone(196, 0, 1.8, 'sine', 0.4); tone(294, 0.02, 1.5, 'sine', 0.22); tone(392, 0.04, 1.2, 'sine', 0.1); } },
  { name: 'ສາມໂນດ', play: () => { tone(659, 0, 0.35); tone(880, 0.16, 0.35); tone(1175, 0.32, 0.7); } },
];
function speakLao(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    const v = speechSynthesis.getVoices().find((x) => /^lo/i.test(x.lang));
    if (!v) return;
    const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; speechSynthesis.speak(u);
  } catch (e) {}
}
function announce(t) {
  if (!P.sound) return;
  CHIMES[P.chime] && CHIMES[P.chime].play();
  setTimeout(() => speakLao('ໄດ້ຮັບເງິນ ' + laoWords(t.amt) + 'ກີບ ລະຫັດ ' + t.code.split('').map((d) => LD[+d] || 'ສູນ').join(' ')), 900);
}
function fakeBeep() { if (!P.sound) return; tone(620, 0, 0.22, 'square', 0.06); tone(620, 0.3, 0.22, 'square', 0.06); }

function newTxn(amt) {
  const t = { ref: 'PH-' + S.seq++, t: nowHM(), amt, route: S.route || 'th', st: 'wait', sample: false };
  return t;
}
function settle(t, st) {
  if (S.net === 'off' && t.st !== 'unk') { t.hidden = st; t.st = 'unk'; }
  else if (S.net === 'off') { t.hidden = st; toast('ໂທລະສັບຍັງຂາດເນັດ · ຍັງບໍ່ຮູ້ຜົນ', 'wifioff'); return false; }
  else { t.st = st; }
  if (t.st === 'ok') { t.code = String(10 + Math.floor(Math.random() * 90)); announce(t); }
  if (!S.txns.includes(t)) S.txns.unshift(t);
  return true;
}
const A = {
  'tab': (el) => { S.screen = el.dataset.to; S.sub = null; S.fromHistory = false; if (S.screen === 'sell' && S.current && S.current.st !== 'wait') S.current = null; },
  'key': (el) => {
    const k = el.dataset.k, s = S.amount ? String(S.amount) : '';
    if (k === 'del') S.amount = s.length > 1 ? +s.slice(0, -1) : 0;
    else { const n = s + k; if (n.replace(/^0+/, '').length <= MAX_DIGITS) S.amount = +n || 0; }
  },
  'clear': () => { S.amount = 0; },
  'go-check': () => { S.screen = 'check'; S.checkSel = S.route; },
  'back-sell': () => { S.screen = 'sell'; },
  'pick-route': (el) => { S.checkSel = el.dataset.id; },
  'use-route': () => { S.route = S.checkSel; S.screen = 'sell'; },
  'go-sign': () => { S.signFrom = 'check'; S.screen = 'sign'; },
  'go-sign-market': () => { S.signFrom = 'market'; S.screen = 'sign'; },
  'show-qr': () => { if (!S.amount) return; S.current = newTxn(S.amount); S.fromHistory = false; S.screen = 'qr'; },
  'cancel-qr': () => { S.current = null; S.screen = 'sell'; toast('ຍົກເລີກ QR ແລ້ວ · ບໍ່ມີການຮັບເງິນ', 'x'); },
  'new-sale': () => { S.current = null; S.amount = 0; S.route = null; S.screen = 'sell'; },
  'retry': () => { const amt = S.current.amt; S.current = newTxn(amt); S.screen = 'qr'; },
  'filter': (el) => { S.filter = el.dataset.f; },
  'open-txn': (el) => { S.current = S.txns.find((t) => t.ref === el.dataset.ref); S.fromHistory = true; S.screen = 'result'; },
  'mode': (el) => { P.mode = el.dataset.m; savePrefs(); },
  'toggle-sound': () => { P.sound = !P.sound; savePrefs(); },
  'chime': (el) => { P.chime = +el.dataset.i; savePrefs(); CHIMES[P.chime].play(); },
  'sub': (el) => { S.sub = el.dataset.id; S.screen = 'sub'; },
  'back-settings': () => { S.sub = null; S.screen = 'settings'; },
  'toast': (el) => { toast(el.dataset.msg, 'info'); },
  'view-shop': () => { S.screen = S.current && S.current.st === 'wait' ? 'qr' : 'sell'; },
  'view-market': () => { S.screen = 'market'; },
  'view-sign': () => { S.signFrom = 'check'; S.screen = 'sign'; },
  'close-ovl': () => { S.overlay = null; },
  'demo-open': () => { S.demoOpen = true; },
  'demo-close': () => { S.demoOpen = false; },
  'fake': () => { S.overlay = 'fake'; S.demoOpen = false; fakeBeep(); },
  'net': (el) => {
    S.net = el.dataset.v;
    if (S.net === 'on') {
      const back = S.txns.filter((t) => t.st === 'unk');
      if (S.current && S.current.st === 'unk' && !back.includes(S.current)) back.push(S.current);
      back.forEach((t) => { settle(t, t.hidden || 'ok'); delete t.hidden; });
      if (back.length) toast(`ເນັດກັບມາ · ${back.map((t) => t.ref + ' ' + ST[t.st].label).join(', ')}`, 'check');
    }
  },
  'bank': (el) => {
    const t = demoTarget();
    if (!t) { toast('ບໍ່ມີລາຍການທີ່ລໍຜົນ · ກົດ "ສະແດງ QR" ກ່ອນ', 'info'); return; }
    if (!settle(t, el.dataset.st)) return;
    S.demoOpen = false;
    if (S.current === t && ['qr', 'result'].includes(S.screen)) { S.screen = 'result'; S.fromHistory = false; }
    else toast(`${t.ref} · ${ST[t.st].label} · ${ST[t.st].act}`, ST[t.st].icon);
  },
  'reset': () => { S = freshState(); toast('ເລີ່ມໃໝ່ແລ້ວ · ຂໍ້ມູນສາທິດຖືກຕັ້ງຄືນ', 'check'); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  ac();
  fn(el);
  render();
});
document.addEventListener('keydown', (e) => {
  if (S.screen !== 'sell' || S.overlay || e.metaKey || e.ctrlKey || e.altKey) return;
  let k = null;
  if (/^[0-9]$/.test(e.key)) k = e.key;
  else if (e.key === 'Backspace') k = 'del';
  else if (e.key === 'Enter' && S.amount) { e.preventDefault(); A['show-qr'](); render(); return; }
  if (k) { e.preventDefault(); A.key({ dataset: { k } }); render(); }
});
setInterval(() => { if (P.mode === 'auto') render(); }, 60000);
/* fit the phone and panel to short laptop or projector screens */
function fit() {
  const main = $('.stage-main');
  const wide = window.matchMedia('(min-width: 900px)').matches;
  const head = $('.stage-head');
  const avail = window.innerHeight - (head ? head.offsetHeight : 0) - 64;
  main.style.zoom = wide ? String(Math.max(0.62, Math.min(1, avail / 840))) : '';
}
window.addEventListener('resize', fit);
fit();
render();
})();
</script>
